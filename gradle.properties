# Windows-ROOT trust store: Norton AV intercepts SSL with its own certificate;
# using the OS trust store (where Norton registers its root CA) fixes PKIX failures.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Djavax.net.ssl.trustStoreType=Windows-ROOT
org.gradle.java.home=C:/Program Files/Java/jdk-27
android.useAndroidX=true
kotlin.code.style=official
org.gradle.parallel=true
org.gradle.daemon=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
